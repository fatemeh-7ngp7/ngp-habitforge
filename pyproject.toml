[project]
name = "ngp-habitforge"
version = "0.1.0"
description = "Enterprise habit tracking platform"
authors = [
    {name = "NGP Team",email = "team@ngp.com"}
]
requires-python = "^3.12"
dependencies = [
    "django (==5.1.*)",
    "djangorestframework (==3.15.*)",
    "djangorestframework-simplejwt (==5.*)",
    "django-cors-headers (==4.*)",
    "django-filter (==24.*)",
    "django-environ (==0.11.*)",
    "django-extensions (==3.*)",
    "psycopg2 (==2.9.*)",
    "redis (==5.*)",
    "celery (==5.4.*)",
    "django-celery-beat (==2.*)",
    "django-celery-results (==2.*)",
    "drf-spectacular (==0.27.*)",
    "pillow (==10.*)",
    "gunicorn (==22.*)",
    "whitenoise (==6.*)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (==8.*)",
    "pytest-django (==4.*)",
    "pytest-cov (==5.*)",
    "factory-boy (==3.*)",
    "faker (==26.*)",
    "black (==24.*)",
    "ruff (==0.5.*)",
    "mypy (==1.*)",
    "django-stubs (==5.*)",
    "ipython (==8.*)",
    "django-debug-toolbar (==4.*)"
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F811"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    migrations
  | .venv
)/
'''
