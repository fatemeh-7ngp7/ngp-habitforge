[tool.poetry]
name = "ngp-habitforge"
version = "5.0.0"
description = "Enterprise habit tracking platform"
authors = ["NGP Team <team@ngp.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
django = ">=5.1,<5.2"
djangorestframework = ">=3.15,<3.16"
djangorestframework-simplejwt = ">=5.0,<6.0"
django-cors-headers = ">=4.0,<5.0"
django-filter = ">=24.0,<25.0"
django-environ = ">=0.11,<0.12"
django-extensions = ">=3.0,<4.0"
psycopg2 = ">=2.9,<3.0"
redis = ">=5.0,<6.0"
celery = ">=5.4,<5.5"
django-celery-beat = ">=2.0,<3.0"
django-celery-results = ">=2.0,<3.0"
drf-spectacular = ">=0.27,<0.28"
Pillow = ">=10.0,<11.0"
gunicorn = ">=22.0,<23.0"
whitenoise = ">=6.0,<7.0"
django-debug-toolbar = "^6.3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-django = ">=4.0,<5.0"
pytest-cov = ">=5.0,<6.0"
factory-boy = ">=3.0,<4.0"
faker = ">=26.0,<27.0"
black = ">=24.0,<25.0"
ruff = ">=0.5,<0.6"
mypy = ">=1.0,<2.0"
django-stubs = ">=5.0,<6.0"
ipython = ">=8.0,<9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "migrations", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F811"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = "/(migrations|\\.venv)/"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
